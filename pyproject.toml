[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abnormal-crowd-detection"
version = "0.1.0"
description = "Abnormal crowd behaviour detection and early warning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "opencv-python-headless>=4.10.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "httpx<0.28.0",
    "streamlit>=1.37.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
crowdguard = "src.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
]
